<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decisions Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
:root{--bg:#141413;--side:#181715;--panel:#1d1c1a;--raise:#262522;--line:#3a3835;--text:#faf9f5;--muted:#a3a097;--accent:#d97757;--accent-bg:#2e1f19;--green:#3fb950;--amber:#e5b567}
</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:rgba(0,0,0,.62);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden">

  <div style="width:720px;max-height:820px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)">

    <div style="height:48px;flex:none;display:flex;align-items:center;padding:0 12px 0 20px;border-bottom:1px solid var(--line)">
      <span style="flex:1;font-weight:600">decisions · settings</span>
      <button title="Close (Esc)" aria-label="Close" style="all:unset;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--muted)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="display:flex;min-height:0">
      <!-- section nav, icon only -->
      <div style="width:56px;flex:none;border-right:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px">
        <span title="Decision Scopes" style="width:36px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--raise);color:var(--accent)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
        </span>
      </div>

      <div style="flex:1;min-width:0;padding:20px 24px;display:flex;flex-direction:column;gap:6px;overflow:hidden">
        <div style="display:flex;align-items:center;margin-bottom:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">
          <span style="flex:1">Decision Scopes</span>
          <span title="Timeout before an in-Scope Decision auto-resolves" style="display:flex;align-items:center;gap:6px;width:90px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        </div>

        <!-- row: on -->
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span title="Mine" style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">Architecture</span>
          <span style="width:90px;color:var(--muted)">none</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">UI</span>
          <span style="width:90px;color:var(--muted)">none</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">UX</span>
          <span style="width:90px;color:var(--muted)">none</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">Data model</span>
          <span style="width:90px;color:var(--muted)">none</span>
        </div>
        <!-- row: off -->
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px;color:var(--muted)">
          <span title="Not mine: auto-resolved" style="width:30px;height:16px;border-radius:8px;background:var(--raise);border:1px solid var(--line);box-sizing:border-box;position:relative;flex:none"><span style="position:absolute;left:2px;top:1px;width:12px;height:12px;border-radius:6px;background:#5b5852"></span></span>
          <span style="flex:1">Dependencies</span>
          <span style="width:90px">auto</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">Security</span>
          <span style="width:90px;color:var(--amber);display:flex;align-items:center;gap:6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>30m</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">Testing strategy</span>
          <span style="width:90px;color:var(--muted)">none</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">Scope and requirements</span>
          <span style="width:90px;color:var(--muted)">none</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">Naming and domain language</span>
          <span style="width:90px;color:var(--muted)">none</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px;color:var(--muted)">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--raise);border:1px solid var(--line);box-sizing:border-box;position:relative;flex:none"><span style="position:absolute;left:2px;top:1px;width:12px;height:12px;border-radius:6px;background:#5b5852"></span></span>
          <span style="flex:1">Performance</span>
          <span style="width:90px">auto</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">Cost/irreversibility</span>
          <span style="width:90px;color:var(--muted)">none</span>
        </div>
        <!-- user-added -->
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px">
          <span style="width:30px;height:16px;border-radius:8px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#141413"></span></span>
          <span style="flex:1">Accessibility</span>
          <span style="width:62px;color:var(--muted)">none</span>
          <button title="Delete Scope" aria-label="Delete Scope" style="all:unset;cursor:pointer;width:28px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        </div>
        <!-- add -->
        <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;margin-top:4px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span title="Add Scope (N)">Add Scope</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
